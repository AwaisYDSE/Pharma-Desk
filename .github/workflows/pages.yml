# Builds the PharmaDesk web app and publishes it on GitHub Pages
# (https://awaisydse.github.io/Pharma-Desk/) — phones install it from there.
name: Web app (GitHub Pages)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:server
      - run: npx vitest run --exclude 'tests/*.e2e.test.ts'
      # The "Use this PC as the server" button downloads this file from the same site.
      - run: cd release && zip -qr ../dist/PharmaDesk-Windows.zip PharmaDesk
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
